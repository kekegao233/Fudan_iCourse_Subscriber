name: Optics 37988 - latest four replays

on:
  workflow_dispatch:
  push:
    branches: ['codex/optics-latest4']
    paths:
      - '.github/workflows/optics_latest4.yml'
      - 'scripts/collect_recent_optics.py'
      - 'scripts/optics_export_public.pem'

permissions:
  contents: read

concurrency:
  group: optics-37988-latest-four
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install collection dependencies
        run: |
          python -m pip install requests pycryptodome sherpa-onnx numpy pillow psutil rapidocr-onnxruntime imagehash
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Restore speech models if already cached
        uses: actions/cache@v4
        with:
          path: |
            sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/
            silero_vad.onnx
          key: asr-models-sense-voice-2024-07-17
      - name: Collect latest four accessible optics replays
        env:
          StuId: ${{ secrets.STUID }}
          UISPsw: ${{ secrets.UISPSW }}
          COURSE_IDS: '37988'
          ASR_NUM_THREADS: '4'
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
        run: python -u scripts/collect_recent_optics.py
      - name: Save encrypted course material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optics37988-latest4-encrypted
          path: results/optics37988-latest4.encrypted.json
          if-no-files-found: error
          retention-days: 3

