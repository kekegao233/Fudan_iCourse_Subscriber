name: Optics 37988 - latest two Tuesday lessons

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optics-37988-tuesday-progress
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install collection dependencies
        run: |
          python -m pip install requests pycryptodome sherpa-onnx numpy pillow psutil rapidocr-onnxruntime imagehash
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Restore speech models if already cached
        uses: actions/cache@v4
        with:
          path: |
            sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/
            silero_vad.onnx
          key: asr-models-sense-voice-2024-07-17
      - name: Collect latest two released Tuesday transcripts
        env:
          StuId: ${{ secrets.STUID }}
          UISPsw: ${{ secrets.UISPSW }}
          UIS_TOTP_SECRET: ${{ secrets.UIS_TOTP_SECRET }}
          COURSE_IDS: '37988'
          ASR_NUM_THREADS: '4'
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
        run: python -u scripts/collect_recent_optics.py --tuesday-progress
      - name: Save encrypted course material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optics37988-tuesday2-encrypted
          path: results/optics37988-tuesday2.encrypted.json
          if-no-files-found: error
          retention-days: 3

